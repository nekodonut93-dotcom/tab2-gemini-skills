  - "Preserve source facts, dialogue, identity, relationships, and outcome."
  - "Writer WHAT is read-only to Director and this adapter."
  - "Unresolved style blocks prompt drafting."
  - "Unverified platform syntax must not appear as a token."
  - "A portable draft must not claim PromptEngine validation."
