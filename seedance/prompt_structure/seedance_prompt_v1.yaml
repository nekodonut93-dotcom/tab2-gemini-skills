contract_id: SEEDANCE_PROMPT_CONTRACT_V1
version: 1.0.0
status: PORTABLE_PROMPT_DRAFT_ONLY
requires:
  - accepted_writer_scene
  - resolved_project_visual_profile
sections:
  - reference_binding
  - character_identity
  - visual_style
  - environment
  - camera
  - timeline
  - physical_action
  - emotion_reaction
  - vfx
  - negative_constraints
must_identify:
  - WHO
  - WHERE
  - WHAT
  - HOW
  - WHEN
  - REFERENCE
  - CAMERA
  - END_STATE
rules:
